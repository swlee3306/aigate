# /etc/ssh/sshd_config.d/aigate-agent.conf -- only affects user `agent`.
# The authorized_keys file is root-owned, so the agent (and anything it runs) cannot remove command= or add keys.
# The admin path (user ubuntu, ProxyCommand via orch-vm) is not touched.
Match User agent
    AuthorizedKeysFile /etc/ssh/aigate/agent_authorized_keys
    PasswordAuthentication no
    AllowAgentForwarding no
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no

#cloud-config
# aigate orchestrator VM (orch-vm). Rendered by infra/create-vms.sh: the public key placeholder below is
# replaced at runtime from ~/.ssh/aigate_ed25519.pub. No secrets belong in this file.
# Tailscale is NOT installed here: the user joins it later by hand with a key they create
# and type themselves (never stored in this repo or in cloud-init).
hostname: orch-vm
manage_etc_hosts: true
timezone: Asia/Seoul
ssh_pwauth: false
disable_root: true

# Sudo policy: the cloud image's default user 'ubuntu' (key-only via the OpenStack keypair)
# is the one-time admin/setup account (its key comes ONLY from the OpenStack keypair = the
# admin public key). The role user below has no sudo key (no sudo) and gets the ROLE public key.
users:
  - default
  - name: orch
    gecos: aigate orchestrator
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "@@AIGATE_PUBKEY@@"

package_update: true
packages:
  - git
  - ca-certificates
  - nftables
  - curl
  - jq
  - sqlite3
  - openssh-client

write_files:
  - path: /etc/nftables.conf
    defer: true
    owner: root:root
    permissions: "0644"
    content: |
      #!/usr/sbin/nft -f
      # Minimal default-drop policy (installed by cloud-init).
      # TODO(Task 2): the full rule set replaces this and tightens OUTBOUND too;
      # until then outbound is allowed so package installs and updates work.
      table inet aigate
      delete table inet aigate
      table inet aigate {
        chain input {
          type filter hook input priority 0; policy drop;
          ct state established,related accept
          ct state invalid drop
          iif "lo" accept
          # DHCP renewals from the Neutron DHCP agent on the local subnet
          ip saddr 10.70.0.0/24 udp sport 67 udp dport 68 accept
          # ssh only from the homeserver (recovery path), the MacBook, the Mac mini (LAN) and over Tailscale (if tailscale0 exists)
          ip saddr { 192.168.1.121, 192.168.1.124, 192.168.1.128 } tcp dport 22 accept
          iifname "tailscale0" tcp dport 22 accept
        }
        chain forward {
          type filter hook forward priority 0; policy drop;
        }
        chain output {
          type filter hook output priority 0; policy accept;
        }
      }

runcmd:
  - systemctl enable --now nftables
  - install -d -o orch -g orch -m 0750 /srv/aigate
  - install -d -o orch -g orch -m 0750 /srv/aigate/work
